# Prometheus 抓取配置。
#
# 注意 gateway 的 /metrics 挂在 observ 网段，不走公网 —— 边缘网关里那条
# `allow 内网 / deny all` 只是第二道保险。

global:
  # 15s 是精度和存储量的折中：更密对 p99 更准，但 15 天留存会很快吃满磁盘
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: loyalty-console
    env: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  # agent 的 /metrics 同样只挂在 observ 网段：nginx 只转发 /api/agent/ 前缀，
  # /metrics 不在其列，公网摸不到。
  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:3001"]
        labels:
          service: agent

  # Prometheus 自身（可选，用来发现「采集本身出问题了」）
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
