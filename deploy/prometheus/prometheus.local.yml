# 本地 Prometheus 采集配置。
#
# 与生产版 prometheus.yml 的唯一差异是 target：
# 本地 gateway 跑在宿主机上（go run / 编好的 exe），不是容器，
# 所以用 host.docker.internal 而不是容器名。
#
# 告警规则**照常加载**。历史上这里曾以「规则依赖 node_* 主机指标、
# Windows 上的 node-exporter 量到的是 Docker Desktop 的 VM」为由关掉了 rules，
# 但 alerts.yml 里 19 条规则全部只基于网关和 agent 自己的指标，
# 没有任何 node_* 依赖 —— 关掉它等于让所有告警从未被验证过。

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      # gateway 跑在宿主机（go run ./cmd/gateway 或编好的 exe）
      - targets: ["host.docker.internal:8080"]
        labels:
          service: gateway
          env: local

  # agent 同样跑在宿主机（node --import tsx src/server.ts）。
  # 和 gateway 一样从宿主机网卡抓，不走容器网络 —— 本地没有 observ 网段。
  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: agent
          env: local

  # Prometheus 自身，用来确认采集本身没挂
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # knowledge-hub 后端（NestJS，跑在宿主机 3000）。
  # 指标前缀是 kh_*，和本项目的 mc_* 区分开：两套系统共用一个 Prometheus，
  # 靠前缀就能在同一个面板里分开看，不需要部署第二个 TSDB。
  - job_name: knowledge-hub
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: knowledge-hub
          env: local
