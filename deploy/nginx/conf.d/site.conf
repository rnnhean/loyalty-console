# HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # 证书续期（Let's Encrypt webroot 校验）必须走明文
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── TLS ──
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只留 TLS 1.2/1.3：1.0/1.1 已被主流浏览器废弃，留着只是扩大攻击面
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── 安全响应头 ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 浏览器端性能剖析（Sentry Profiles）需要这个头。
    # Chrome 的 JS Self-Profiling API 受 Document-Policy 门控：没有它浏览器
    # 直接拒绝采集、SDK 侧不报错，表现就是 Profiles 页面永远没数据。
    # 开发环境对应 vite.config.ts 的 server.headers，两处必须一致。
    add_header Document-Policy "js-profiling" always;

    # CSP：
    #   - style-src 必须带 'unsafe-inline'：antd 5 用 CSS-in-JS 动态插入 <style>；
    #   - connect-src 放 Sentry 域名，否则上报会被浏览器直接拦掉；
    #   - frame-ancestors 'none' 与 X-Frame-Options 双保险，防点击劫持。
    add_header Content-Security-Policy "default-src 'self'; \
        script-src 'self'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data: blob:; \
        font-src 'self' data:; \
        connect-src 'self' https://*.sentry.io; \
        frame-ancestors 'none'; \
        base-uri 'self'; \
        form-action 'self'" always;

    limit_conn conn_zone 50;

    # ── 登录：最严的一档 ──
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        include /etc/nginx/conf.d/proxy_timeouts.inc;
    }

    # ── 前端监控上报：匿名可达，单独限流 ──
    location = /api/telemetry/beacon {
        limit_req zone=api_zone burst=30 nodelay;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        include /etc/nginx/conf.d/proxy_timeouts.inc;
    }

    # ── 诊断助手：SSE 长连接 ──
    #
    # 单独一档，因为它是全站唯一「响应写几十秒」的路由：
    # 一次诊断最长 45 秒，期间靠 15 秒一次的注释帧保活。
    # ★ 必须放在 /api/ 之前读起来才顺（nginx 按最长前缀匹配，顺序其实不影响）。
    #
    # 超时不 include proxy_timeouts.inc：nginx 不允许同一 block 里
    # 重复写 proxy_read_timeout（duplicate directive），默认 30 秒虽然
    # 能被保活帧续命，但那是隐式耦合——谁把 ping 间隔调大一点这里就静默断流。
    #
    # 不在这里加鉴权：token 校验在网关，agent 会先拿它验一次票再花钱。
    location ^~ /api/agent/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://console_agent;
        include /etc/nginx/conf.d/proxy_common.inc;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    120s;

        # 关缓冲：事件必须逐条到浏览器，攒着发就等于「等 45 秒后一次性出结果」
        proxy_buffering off;
        proxy_cache off;
    }

    # ── 业务 API ──
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        include /etc/nginx/conf.d/proxy_timeouts.inc;
    }

    # ── 指标端点：只允许内网 Prometheus 抓 ──
    # 直接暴露到公网等于把「服务内部结构、流量规模、错误率」免费送人。
    location = /metrics {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        include /etc/nginx/conf.d/proxy_timeouts.inc;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        include /etc/nginx/conf.d/proxy_timeouts.inc;
    }

    # ── 静态资源 ──
    location / {
        proxy_pass http://console_web;
        include /etc/nginx/conf.d/proxy_common.inc;
        include /etc/nginx/conf.d/proxy_timeouts.inc;
    }
}
