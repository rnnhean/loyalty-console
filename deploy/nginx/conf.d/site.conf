# HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # 证书续期（Let's Encrypt webroot 校验）必须走明文
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── TLS ──
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只留 TLS 1.2/1.3：1.0/1.1 已被主流浏览器废弃，留着只是扩大攻击面
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── 安全响应头 ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP：
    #   - style-src 必须带 'unsafe-inline'：antd 5 用 CSS-in-JS 动态插入 <style>；
    #   - connect-src 放 Sentry 域名，否则上报会被浏览器直接拦掉；
    #   - frame-ancestors 'none' 与 X-Frame-Options 双保险，防点击劫持。
    add_header Content-Security-Policy "default-src 'self'; \
        script-src 'self'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data: blob:; \
        font-src 'self' data:; \
        connect-src 'self' https://*.sentry.io; \
        frame-ancestors 'none'; \
        base-uri 'self'; \
        form-action 'self'" always;

    limit_conn conn_zone 50;

    # ── 登录：最严的一档 ──
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ── 前端监控上报：匿名可达，单独限流 ──
    location = /api/telemetry/beacon {
        limit_req zone=api_zone burst=30 nodelay;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ── 业务 API ──
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ── 指标端点：只允许内网 Prometheus 抓 ──
    # 直接暴露到公网等于把「服务内部结构、流量规模、错误率」免费送人。
    location = /metrics {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://console_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ── 静态资源 ──
    location / {
        proxy_pass http://console_web;
        include /etc/nginx/conf.d/proxy_common.inc;
    }
}
