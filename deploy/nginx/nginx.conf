# 边缘网关（公网唯一入口）。
#
# 职责划分：
#   - 本层：TLS 终结、静态资源与 API 统一入口、第一道限流、安全响应头
#   - 应用层（Go gateway）：鉴权、按调用方限流、trace_id、指标
#
# 为什么两层都要限流：
# nginx 的 limit_req 在连接层就把洪峰挡掉，请求根本进不了 Go 进程，
# 成本远低于让应用层去建令牌桶。应用层的限流则能按「调用方身份」做，
# 这是 nginx 做不到的（它只知道 IP）。

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # ── 日志 ──
    # 只记必要字段。**不记 query string**：后台系统的 URL 常带订单号/临时票据，
    # 落进日志就等于把业务数据写到了磁盘上。
    log_format main escape=json '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"trace_id":"$sent_http_x_trace_id",'
        '"ua":"$http_user_agent"'
    '}';
    # 日志写 stdout/stderr，交给容器运行时收集。
    # 写成文件路径的话，容器一删日志就没了，而且 docker logs 读不到。
    # buffer=32k flush=5s：攒够 32KB 或每 5 秒落一次，避免每条请求一次 syscall。
    access_log /dev/stdout main buffer=32k flush=5s;
    error_log  /dev/stderr warn;

    # ── 传输 ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # ── 第一道限流 ──
    # 按 IP 分桶。API 单独一档，比静态资源严得多。
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # 上游
    upstream console_api {
        server gateway:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream console_web {
        server web:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # 诊断助手。它只有一个 POST 接口，但一次请求可能持续 45 秒（SSE 流）。
    upstream console_agent {
        server agent:3001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
