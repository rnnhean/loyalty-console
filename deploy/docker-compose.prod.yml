# 生产部署编排（公网）。
#
# 网络分段是这份文件里最重要的设计：
#   edge     —— 只有边缘网关、前端、API 在这个网段，能和公网通信
#   data     —— 数据库与缓存只挂这里，**不 publish 任何端口**
#   observ   —— Prometheus / Grafana 独立网段，抓取时能进 data，但公网进不来
#
# 这样即使应用被拿下，攻击者也摸不到 MySQL 端口 —— 因为它根本没暴露。
#
# 用法见 docs/DEPLOYMENT.md。

name: loyalty-console

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── 边缘网关 ──
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
      # ★ 不要挂 /var/log/nginx。
      #   官方镜像里 access.log 是指向 /dev/stdout 的符号链接，
      #   挂一个具名卷会覆盖它，日志改成写卷里的普通文件——
      #   后果是 docker logs 看不到访问日志，而且这个卷不受
      #   logging: 轮转管辖，会无限增长把盘写满。
      #   不挂的话日志走 stdout，由下面 logging: 统一轮转。
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_started
    networks: [edge]
    logging: *default-logging

  # ── 前端静态资源 ──
  web:
    build:
      context: ../web
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        SENTRY_ENV: production
    restart: unless-stopped
    networks: [edge]
    logging: *default-logging

  # ── API 网关 ──
  gateway:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      MC_ADDR: ":8080"
      MC_MYSQL_DSN: "app:${MYSQL_PASSWORD}@tcp(mysql:3306)/mc_core?charset=utf8mb4&parseTime=true&loc=Local"
      MC_REDIS_ADDR: "redis:6379"
      MC_REDIS_DB: "0"
      MC_REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
      MC_MYSQL_MAX_OPEN: "32"
      MC_MYSQL_MAX_IDLE: "8"
      # ★ 密钥必须由部署环境注入，绝不写进镜像或仓库
      MC_TOKEN_SECRET: ${MC_TOKEN_SECRET:?必须设置 MC_TOKEN_SECRET}
      MC_TOKEN_TTL_MIN: "720"
      MC_ADMIN_USER: ${MC_ADMIN_USER:-admin}
      MC_ADMIN_PASS: ${MC_ADMIN_PASS:?必须设置 MC_ADMIN_PASS}
      MC_RATE_RPS: "30"
      MC_RATE_BURST: "60"
      MC_LOGIN_RPS: "2"
      # 前端埋点上报单独限流：埋点量大且价值低于业务接口，
      # 不能让它挤占真实请求的令牌桶。
      MC_TELEMETRY_RPS: "50"
      # 同源部署时留空即可（nginx 已把 /api 代理到本服务）；
      # 前后端分域时填具体 origin，逗号分隔。
      MC_CORS_ORIGINS: ${MC_CORS_ORIGINS:-}
      MC_LOG_LEVEL: ${MC_LOG_LEVEL:-info}
      # ── 消息与对象存储 ──
      #
      # 这三个组件在网关里是**可降级**的：没起来服务照常启动，
      # 对应能力返回 503 / 走降级分支。所以下面 depends_on 只列了
      # mysql 和 redis —— 把 kafka 加进依赖会让「Kafka 挂了就进不了
      # 管理台」，那正是我们想避免的。
      MC_KAFKA_BROKERS: "kafka:9092"
      MC_KAFKA_TOPIC: "console.events"
      MC_KAFKA_GROUP: "console-audit"
      # vhost 必须写成 %2Fconsole：直接写 /console 会被解析成名为
      # "console" 的 vhost（少了前导斜杠），报 vhost not found。
      MC_RABBIT_URL: "amqp://mc:${RABBIT_PASSWORD:?必须设置 RABBIT_PASSWORD}@rabbitmq:5672/%2Fconsole"
      # BLOB_ENDPOINT 是服务端读写用的内网地址；PUBLIC_ENDPOINT 是
      # 生成预签名 URL 时用的对外地址。两者必须分开 —— V4 签名把 Host
      # 算进了签名内容，用内网地址签出来的 URL 浏览器打不开。
      # 注意：这里填的是 host:port，不带 http:// 前缀（SDK 只接受这种形式），
      # 是否走 TLS 由 MC_BLOB_USE_SSL 决定。
      MC_BLOB_ENDPOINT: "minio:9000"
      MC_BLOB_USE_SSL: "0"
      MC_BLOB_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_HOST:?必须设置 MINIO_PUBLIC_HOST}
      MC_BLOB_ACCESS_KEY: ${MINIO_ROOT_USER:?必须设置 MINIO_ROOT_USER}
      MC_BLOB_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}
      MC_BLOB_EXPORT_BUCKET: ${MINIO_BUCKET:-console-export}
    # 不 publish 端口：只有 nginx 能在 edge 网段访问它
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # distroless 里没有 curl/nc，所以健康检查由程序自己实现：
      # 带 -healthcheck 启动时只请求一次 /healthz 然后退出。
      test: ["CMD", "/usr/local/bin/gateway", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    # 同时挂 observ 网段：Prometheus 从这里抓 /metrics，
    # 而不是把 metrics 端点暴露到 edge（公网可达的那一层）。
    networks: [edge, data, observ]
    logging: *default-logging

  # ── 消息队列与对象存储 ──
  #
  # 全部只挂 data 网段（internal: true），不对公网 publish 端口。
  # 唯一例外是 MinIO 的 S3 口：导出文件的下载链接直接指向它，
  # 浏览器必须能访问。那个口只接受预签名 URL，桶本身不公开。
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 生产只有容器内访问，不需要双 listener：advertise 就写服务名。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 72 小时：足够覆盖一个周末的补发窗口，又不至于把盘吃满。
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [data]
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mc
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?必须设置 RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /console
    # 管理界面只在 data 网段可达：需要时用 SSH 隧道打开，
    # 不把 15672 暴露到公网（默认口令 + 管理界面是常见的入口点）。
    expose:
      - "15672"
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [data]
    logging: *default-logging

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    # 生产不用 user: root，而是显式指定镜像自带的非 root 用户。
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必须设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    # 只开 S3 API；控制台 9001 留在 data 网段里，走隧道访问。
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [data]
    logging: *default-logging

  # MinIO 不会自动建桶，用一次性容器初始化。
  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-console-export} &&
      mc mb --ignore-existing local/console-tmp &&
      echo 'buckets ready'
      "
    restart: "no"
    networks: [data]

  # ── 数据库 ──
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --slow-query-log=1
      - --long-query-time=1
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mc_core
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须设置 MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # ★ 不 publish 端口。开发机要连的话用 docker compose exec，或临时加端口映射。
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [data]
    logging: *default-logging

  # ── 缓存 ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    # 口令通过环境变量在启动时注入，而不是写死进镜像或 command：
    # 镜像会被推到 registry，command 会出现在 docker inspect 里。
    entrypoint: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    logging: *default-logging

  # ── 指标采集 ──
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 保留期按磁盘算：15 天足够回溯「昨天下午那次抖动」
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks: [observ]
    logging: *default-logging

  # ── 可视化 ──
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?必须设置 GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:13000}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 默认只绑本机回环，要看面板走 SSH 隧道或内网。
    # 确实要公网访问时改成 "0.0.0.0:13000:13000" 并确保已在 nginx 上加了鉴权。
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - prometheus
    networks: [observ]
    logging: *default-logging

  # ── 主机指标（CPU/内存/磁盘/网络）──
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks: [observ]
    logging: *default-logging

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true   # ★ 没有外部出口，数据库连不上公网
  observ:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
