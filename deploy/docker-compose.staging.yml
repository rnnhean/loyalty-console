# ─────────────────────────────────────────────────────────────
# 测试 / 预发环境编排
#
# ★ 状态：**未部署、未验证**。本文件是把生产编排的骨架抽出来、
#   替换掉所有域名相关项后的样子。域名确定后按 <<>> 标注逐项补齐即可。
#
# 与 docker-compose.prod.yml 的差别：
#   - 80/443 之外的端口是否 publish 取决于测试机是否有公网
#   - 不需要 certbot（可以用自签证书或干脆先跑 HTTP）
#   - 资源限制放宽，方便压测
#   - 日志保留更短
#
# 用法：
#   MC_ENV=staging docker compose -f docker-compose.staging.yml up -d
#
# 需要先准备的环境变量（不写在本文件、也不进仓库）：
#   MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / REDIS_PASSWORD /
#   RABBIT_PASSWORD / MINIO_ROOT_USER / MINIO_ROOT_PASSWORD /
#   MC_TOKEN_SECRET / MC_ADMIN_PASS / GRAFANA_PASSWORD /
#   VITE_SENTRY_DSN / MINIO_PUBLIC_HOST

name: loyalty-console-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ── 边缘网关 ──
  # 测试环境先只开 80：证书要么用自签、要么等域名下来再上 certbot。
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # ★ 域名和证书就绪后放开下面这行，并把 certs 挂载补上
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # ★ 证书就绪后补：
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_started
    networks: [edge]
    logging: *default-logging

  # ── 前端静态资源 ──
  web:
    build:
      context: ../web
      args:
        APP_VERSION: ${APP_VERSION:-staging}
        SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        SENTRY_ENV: staging
    restart: unless-stopped
    networks: [edge]
    logging: *default-logging

  # ── API 网关 ──
  gateway:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      MC_ENV: staging
      # 关键：显式关掉开发期放行开关。开着的话密钥丢失会被静默兜住。
      MC_ALLOW_DEV_SECRET: "0"
      MC_ADDR: ":8080"
      MC_MYSQL_DSN: "app:${MYSQL_PASSWORD:?必须设置 MYSQL_PASSWORD}@tcp(mysql:3306)/mc_core?charset=utf8mb4&parseTime=true&loc=Local"
      MC_REDIS_ADDR: "redis:6379"
      MC_REDIS_DB: "0"
      MC_REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
      MC_MYSQL_MAX_OPEN: "16"
      MC_MYSQL_MAX_IDLE: "4"
      MC_TOKEN_SECRET: ${MC_TOKEN_SECRET:?必须设置 MC_TOKEN_SECRET}
      MC_TOKEN_TTL_MIN: "720"
      MC_ADMIN_USER: ${MC_ADMIN_USER:-admin}
      MC_ADMIN_PASS: ${MC_ADMIN_PASS:?必须设置 MC_ADMIN_PASS}
      # 测试环境放宽限流：回归脚本和压测会被卡
      MC_RATE_RPS: "60"
      MC_RATE_BURST: "120"
      MC_LOGIN_RPS: "5"
      MC_TELEMETRY_RPS: "100"
      MC_CORS_ORIGINS: ${MC_CORS_ORIGINS:-}
      # 测试环境把日志开到 debug，方便查问题；生产不要跟着学
      MC_LOG_LEVEL: ${MC_LOG_LEVEL:-debug}
      MC_KAFKA_BROKERS: "kafka:9092"
      MC_KAFKA_TOPIC: "console.events"
      MC_KAFKA_GROUP: "console-audit"
      MC_RABBIT_URL: "amqp://mc:${RABBIT_PASSWORD:?必须设置 RABBIT_PASSWORD}@rabbitmq:5672/%2Fconsole"
      MC_BLOB_ENDPOINT: "minio:9000"
      MC_BLOB_USE_SSL: "0"
      # ★ 域名待定。预签名 URL 把 Host 算进签名，填内网地址浏览器打不开。
      MC_BLOB_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_HOST:?必须设置 MINIO_PUBLIC_HOST}
      MC_BLOB_ACCESS_KEY: ${MINIO_ROOT_USER:?必须设置 MINIO_ROOT_USER}
      MC_BLOB_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}
      MC_BLOB_EXPORT_BUCKET: ${MINIO_BUCKET:-console-export}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [edge, data, observ]
    logging: *default-logging

  # ── 消息队列与对象存储 ──
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 测试环境留一天就够，不需要生产那份 72 小时的补发窗口
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [data]
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mc
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?必须设置 RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /console
    expose:
      - "15672"
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [data]
    logging: *default-logging

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必须设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    # 测试机若无公网，这段可以注释掉，走 SSH 隧道下载导出文件
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [data]
    logging: *default-logging

  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-console-export} &&
      mc mb --ignore-existing local/console-tmp &&
      echo 'buckets ready'
      "
    restart: "no"
    networks: [data]
    logging: *default-logging

  # ── 数据库 ──
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
      - --slow-query-log=1
      - --long-query-time=1
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mc_core
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须设置 MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [data]
    logging: *default-logging

  # ── 缓存 ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    entrypoint: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    logging: *default-logging

  # ── 指标采集 ──
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 测试环境保留期短：7 天够回溯一次回归
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks: [observ]
    logging: *default-logging

  # ── 可视化 ──
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?必须设置 GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # ★ 域名待定。定了以后填真实地址，否则面板里的分享链接会指错。
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:13000}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - prometheus
    networks: [observ]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks: [observ]
    logging: *default-logging

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  observ:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
