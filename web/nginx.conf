# 容器内的静态资源服务。
#
# 这里只管「静态文件 + SPA 路由回退」。
# API 反代、TLS、限流、安全响应头都在最外层网关（deploy/nginx）统一做 ——
# 分层原则：边缘管安全，业务容器只管内容。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存，否则发版后用户仍加载旧 bundle
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA 回退：/catalog/spu 这类前端路由直接访问时也要返回 index.html，
    # 否则刷新页面 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源不需要访问日志，省磁盘
    access_log off;
}
